{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная карта образовательных учреждений Липецкой области</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Образовательные учреждения Липецкой области</h1>
            <div class="header-controls">
                <button id="adminLogin" class="btn btn-secondary hidden">Вход администратора</button>
                <div id="adminPanel" class="admin-panel hidden">
                    <button id="addInstitution" class="btn btn-primary">Добавить учреждение</button>
                    <button id="logout" class="btn btn-secondary">Выход</button>
                </div>
            </div>
        </header>
        <main class="main">
            <div class="map-legend-wrapper">
                <div class="map-container">
                    <div id="mapWrapper" class="map-wrapper"></div>
                    <div id="tooltip" class="tooltip hidden"></div>
                </div>
                <div class="legend-container">
                    <h3>Легенда</h3>
                    <ul id="legendList" class="legend-list"></ul>
                </div>
            </div>
        </main>
        <div id="pageLoader" class="page-loader">
            <div class="loader"></div>
            <p>Загрузка карты...</p>
        </div>
    </div>

    {% include "mapapp/partials/modals.html" %}

    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/utils.js' %}"></script>
    <script src="{% static 'js/map.js' %}"></script>
    <script src="{% static 'js/institutions.js' %}"></script>
    <script src="{% static 'js/filters.js' %}"></script>
    <script src="{% static 'js/admin.js' %}"></script>
    <script src="{% static 'js/admin-auth.js' %}"></script>
    <script src="{% static 'js/admin-form.js' %}"></script>
    <script src="{% static 'js/admin-crud.js' %}"></script>
    <script src="{% static 'js/bootstrap.js' %}"></script>
    <script src="{% static 'js/accessibility.js' %}"></script>
</body>
</html>
