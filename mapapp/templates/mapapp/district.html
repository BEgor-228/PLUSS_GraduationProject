{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ district.name }} - учреждения ОВЗ</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body class="district-page" data-page="district" data-district-id="{{ district.id }}" data-district-name="{{ district.name|escape }}">
    <div id="mapWrapper" class="hidden"></div>
    <div id="tooltip" class="hidden"></div>

    {% include "mapapp/partials/modals.html" %}

    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/utils.js' %}"></script>
    <script src="{% static 'js/map.js' %}"></script>
    <script src="{% static 'js/institutions.js' %}"></script>
    <script src="{% static 'js/filters.js' %}"></script>
    <script src="{% static 'js/admin.js' %}"></script>
    <script src="{% static 'js/admin-auth.js' %}"></script>
    <script src="{% static 'js/admin-form.js' %}"></script>
    <script src="{% static 'js/admin-crud.js' %}"></script>
    <script src="{% static 'js/bootstrap.js' %}"></script>
    <script src="{% static 'js/accessibility.js' %}"></script>
</body>
</html>
