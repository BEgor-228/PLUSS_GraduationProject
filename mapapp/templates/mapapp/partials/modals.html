<div id="districtModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <div style="width: 30px;"></div>
            <div class="institution-type-filter">
                <div class="type-filter-buttons">
                    <button class="type-filter-btn active" data-type="all">Все</button>
                    <button class="type-filter-btn" data-type="preschool">Детские сады</button>
                    <button class="type-filter-btn" data-type="school">Школы</button>
                    <button class="type-filter-btn" data-type="school_internat">Интернаты</button>
                    <button class="type-filter-btn" data-type="spo">СПО</button>
                    <button class="type-filter-btn" data-type="vo">ВО</button>
                </div>
            </div>
            <button id="closeModal" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
            <div id="modalLoader" class="modal-loader hidden">
                <div class="loader"></div>
                <p>Загрузка данных...</p>
            </div>

            <div class="region-info-section">
                <h3 id="regionName">Название региона</h3>
                <svg class="region-image" xmlns="http://www.w3.org/2000/svg"></svg>
                <div class="region-details"><div id="regionLinks" class="region-links"></div></div>
            </div>

            <div class="institutions-section">
                <div class="institutions-header">
                    <div class="inst-head">
                        <h3>Учреждения <span id="institutionCount">(0)</span></h3>
                        <button id="toggleFilters" class="filters-toggle-btn">Фильтры</button>
                    </div>
                    <div class="search-bar"><input type="text" id="institutionSearch" placeholder="Поиск учреждения..." style="width:100%; padding:8px; box-sizing:border-box;"></div>
                    <div id="paginationTop" class="pagination hidden">
                        <button id="prevPageTop" class="pagination-btn pagination-prev" type="button">&lt;</button>
                        <div id="paginationNumbersTop" class="pagination-numbers"></div>
                        <button id="nextPageTop" class="pagination-btn pagination-next" type="button">&gt;</button>
                    </div>
                </div>
                <div id="institutionsList" class="institutions-list"></div>
                <div id="paginationBottom" class="pagination hidden">
                    <button id="prevPageBottom" class="pagination-btn pagination-prev" type="button">&lt;</button>
                    <div id="paginationNumbersBottom" class="pagination-numbers"></div>
                    <button id="nextPageBottom" class="pagination-btn pagination-next" type="button">&gt;</button>
                </div>
                <div id="debugInfo" style="text-align: center; color: #666; font-size: 12px; margin-top: 10px;"></div>
            </div>

            <div class="filters-overlay" id="filtersOverlay"></div>
            <div class="filters-section" id="filtersSection">
                <div class="filters">
                    <h3 class="filters-header">Фильтры</h3>
                    <div class="filter-group-accordion institution-type-filter-mobile">
                        <button class="accordion-toggle">Тип учреждения</button>
                        <div class="accordion-content">
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_type" value="preschool"> Детские сады</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_type" value="school"> Школы</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_type" value="spo"> СПО</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_type" value="vo"> ВО</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_type" value="school_internat"> Интернаты</label>
                        </div>
                    </div>
                    <div class="filter-group-accordion">
                        <button class="accordion-toggle">Возраст</button>
                        <div class="accordion-content">
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_age" value="1.5-3"> 1,5–3 лет</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_age" value="3-5"> 3–5 лет</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_age" value="5-7"> 5–7 лет</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_age" value="7+"> 7+ лет</label>
                        </div>
                    </div>
                    <div class="filter-group-accordion">
                        <button class="accordion-toggle">Условия обучения (ОВЗ)</button>
                        <div class="accordion-content">
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_condition" value="hearing_impairment"> Нарушение слуха</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_condition" value="vision_impairment"> Нарушение зрения</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_condition" value="musculoskeletal_impairment"> Нарушения ОДА</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_condition" value="speech_impairment"> Нарушение речи</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_condition" value="autism"> РАС</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_condition" value="mental_retardation"> ЗПР</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_condition" value="multiple_disorders"> Множественные нарушения</label>
                        </div>
                    </div>
                    <div class="filter-group-accordion">
                        <button class="accordion-toggle">Программы АООП</button>
                        <div class="accordion-content">
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_aoop" value="aoop"> Есть программы АООП</label>
                        </div>
                    </div>
                    <div class="filter-group-accordion">
                        <button class="accordion-toggle">Критерии физической доступности</button>
                        <div class="accordion-content">
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_accessibility" value="ramps_lifts"> Нормативные пандусы и подъемники</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_accessibility" value="entrance_groups_doorways"> Входные группы и дверные проемы</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_accessibility" value="tactile_pedestrian_indicators"> Тактильно-пешеходные указатели</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_accessibility" value="braille_signage"> Таблички со шрифтом Брайля</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_accessibility" value="accessible_sanitary_facilities"> Оборудованные санитарно-гигиенические помещения</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_accessibility" value="assistant_call_system"> Система вызова помощника</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_accessibility" value="contrast_marking"> Контрастная маркировка</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_accessibility" value="safety_zones_evacuation_routes"> Зоны безопасности и пути эвакуации</label>
                            <label class="filter-option lab-check"><input type="checkbox" name="filter_accessibility" value="acoustic_systems_induction_loops"> Акустические системы и индукционные петли</label>
                        </div>
                    </div>
                </div>
                <div class="filter-actions">
                    <button id="applyFilters" class="filter-btn1 btn btn-primary">Применить</button>
                    <button id="resetFilters" class="filter-btn1 reset btn btn-secondary">Сбросить</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="loginModal" class="modal hidden">
    <div class="modal-content auth-modal-content">
        <div class="modal-header">
            <h2 id="authModalTitle">Вход</h2>
            <button id="closeLoginModal" class="close-btn">&times;</button>
        </div>
        <div class="login-modal-body">
            <div class="auth-role-tabs">
                <button type="button" id="authRoleUser" class="auth-role-btn active">Пользователь</button>
                <button type="button" id="authRoleAdmin" class="auth-role-btn">Администратор</button>
            </div>
            <form id="loginForm">
                <div id="loginBlockedBanner" class="login-blocked-banner hidden" role="alert" aria-live="assertive">
                    <div class="login-blocked-banner-inner">
                        <span class="login-blocked-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="36" height="36" focusable="false">
                                <rect x="5" y="11" width="14" height="10" rx="1.5" fill="#b8860b"/>
                                <path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#8b6914" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </span>
                        <div class="login-blocked-texts">
                            <p class="login-blocked-title">Аккаунт заблокирован</p>
                            <p id="loginBlockedReason" class="login-blocked-reason"></p>
                        </div>
                    </div>
                </div>
                <div id="loginErrorMessage" class="login-error-message hidden" role="alert" aria-live="polite"></div>
                <div class="form-group">
                    <label for="adminLoginInput" id="authLoginLabel">Логин или Email</label>
                    <input type="text" id="adminLoginInput" placeholder="Введите email" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Пароль</label>
                    <input type="password" id="adminPassword" required autocomplete="current-password">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Войти</button>
                    <button type="button" id="cancelLogin" class="btn btn-secondary">Отмена</button>
                </div>
                <div class="auth-switch-row">
                    <span>Нет аккаунта?</span>
                    <button type="button" id="openRegisterModal" class="auth-link-btn">Зарегистрируйтесь здесь</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="registerModal" class="modal hidden">
    <div class="modal-content auth-modal-content">
        <div class="modal-header">
            <h2>Создать аккаунт</h2>
            <button id="closeRegisterModal" class="close-btn">&times;</button>
        </div>
        <div class="login-modal-body">
            <form id="registerForm">
                <div id="registerErrorMessage" class="login-error-message hidden" role="alert" aria-live="polite"></div>
                <div class="form-group">
                    <label for="registerFullName">Полное имя</label>
                    <input type="text" id="registerFullName" placeholder="Введите ваше полное имя" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Электронная почта</label>
                    <input type="email" id="registerEmail" placeholder="example@mail.ru" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Пароль</label>
                    <input type="password" id="registerPassword" placeholder="Создайте надежный пароль" required>
                </div>
                <div class="form-group">
                    <label for="registerPasswordConfirm">Подтверждение пароля</label>
                    <input type="password" id="registerPasswordConfirm" placeholder="Повторите пароль" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                    <button type="button" id="cancelRegister" class="btn btn-secondary">Отмена</button>
                </div>
                <div class="auth-switch-row">
                    <span>Уже есть аккаунт?</span>
                    <button type="button" id="openLoginFromRegister" class="auth-link-btn">Войдите здесь</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="institutionModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="institutionModalTitle">Добавить учреждение</h2>
            <button id="closeInstitutionModal" class="close-btn">&times;</button>
        </div>
        <div class="modal-body2">
            <form id="institutionForm" class="institution-form">
                <div class="form-group"><label for="institutionName">Название учреждения *</label><input type="text" id="institutionName" required></div>
                <div class="form-group">
                    <label for="districtId">Район *</label>
                    <select id="districtId" required><option value="">Выберите район</option></select>
                </div>
                <div class="form-group"><label for="institutionDescription">Описание</label><textarea id="institutionDescription" rows="3"></textarea></div>
                <div class="form-group">
                    <label for="institutionType">Тип учреждения *</label>
                    <select id="institutionType" required>
                        <option value="">Выберите тип</option>
                        <option value="preschool">Дошкольное</option>
                        <option value="school">Школа</option>
                        <option value="school_internat">Школа-интернат</option>
                        <option value="spo">СПО</option>
                        <option value="vo">ВО</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Условия приема:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" value="certificate" name="admission" id="doc_certificate"> Свидетельство</label>
                        <label><input type="checkbox" value="attestat" name="admission" id="doc_attestat"> Аттестат</label>
                    </div>
                </div>
                <div class="form-group" id="rangeGroup">
                    <label id="rangeLabel">Диапазон</label>
                    <div class="range-inputs">
                        <input type="number" id="rangeMin" placeholder="От" min="1" max="25" step="1" style="width: 80px;">
                        <span>—</span>
                        <input type="number" id="rangeMax" placeholder="До" min="1" max="25" step="1" style="width: 80px;">
                        <span id="rangeUnit">(лет/классов)</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Особые условия</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" value="hearing_impairment" name="conditions"> Нарушения слуха</label>
                        <label><input type="checkbox" value="vision_impairment" name="conditions"> Нарушения зрения</label>
                        <label><input type="checkbox" value="musculoskeletal_impairment" name="conditions"> Нарушения опорно-двигательного аппарата</label>
                        <label><input type="checkbox" value="speech_impairment" name="conditions"> Нарушения речи</label>
                        <label><input type="checkbox" value="mental_retardation" name="conditions"> Задержка психического развития</label>
                        <label><input type="checkbox" value="autism" name="conditions"> Расстройство аутистического спектра</label>
                        <label><input type="checkbox" value="multiple_disorders" name="conditions"> Множественные нарушения развития</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Критерии физической доступности</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" value="ramps_lifts" name="accessibility_criteria"> Нормативные пандусы и подъемники</label>
                        <label><input type="checkbox" value="entrance_groups_doorways" name="accessibility_criteria"> Входные группы и дверные проемы</label>
                        <label><input type="checkbox" value="tactile_pedestrian_indicators" name="accessibility_criteria"> Тактильно-пешеходные указатели</label>
                        <label><input type="checkbox" value="braille_signage" name="accessibility_criteria"> Информационные таблички со шрифтом Брайля</label>
                        <label><input type="checkbox" value="accessible_sanitary_facilities" name="accessibility_criteria"> Оборудованные санитарно-гигиенические помещения</label>
                        <label><input type="checkbox" value="assistant_call_system" name="accessibility_criteria"> Система вызова помощника</label>
                        <label><input type="checkbox" value="contrast_marking" name="accessibility_criteria"> Контрастная маркировка</label>
                        <label><input type="checkbox" value="safety_zones_evacuation_routes" name="accessibility_criteria"> Зоны безопасности и пути эвакуации</label>
                        <label><input type="checkbox" value="acoustic_systems_induction_loops" name="accessibility_criteria"> Акустические системы и индукционные петли</label>
                    </div>
                </div>
                <div class="form-group"><label for="institutionAddress">Адрес учреждения</label><input type="text" id="institutionAddress"></div>
                <div class="form-group"><label for="directorName">ФИО руководителя</label><input type="text" id="directorName"></div>
                <div class="form-group"><label for="directorPhone">Телефон руководителя</label><input type="tel" id="directorPhone"></div>
                <div class="form-group"><label for="directorEmail">Email руководителя</label><input type="email" id="directorEmail"></div>
                <div class="form-group"><label for="institutionWebsite">Сайт учреждения</label><input type="url" id="institutionWebsite"></div>
                <div class="form-group"><label for="institutionAoopUrl">Ссылка на АООП</label><input type="url" id="institutionAoopUrl"></div>
                <div class="form-group" id="aoopGroup">
                    <label>Реализуемые АООП</label>
                    <div id="aoopList" class="aoop-list"></div>
                    <button type="button" id="addAoOp" class="btn btn-secondary">Добавить программу</button>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <button type="button" id="cancelInstitution" class="btn btn-secondary">Отмена</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="reviewModal" class="modal hidden">
    <div class="modal-content review-modal-content">
        <div class="modal-header">
            <h2>Оставить отзыв</h2>
            <button id="closeReviewModal" class="close-btn">&times;</button>
        </div>
        <div class="modal-body2">
            <form id="reviewForm" class="institution-form">
                <input type="hidden" id="reviewInstitutionId">
                <div class="form-group">
                    <label for="reviewInstitutionName">Учреждение</label>
                    <input id="reviewInstitutionName" type="text" readonly>
                </div>
                <div class="form-group">
                    <label for="reviewComment">Ваш отзыв</label>
                    <textarea id="reviewComment" rows="5" placeholder="Напишите ваш отзыв..."></textarea>
                </div>
                <div class="form-group">
                    <label for="reviewInstitutionRating">Оценка учреждения</label>
                    <select id="reviewInstitutionRating" required>
                        <option value="">Выберите оценку</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Оценка критериев доступности</label>
                    <div id="reviewCriteriaList" class="review-criteria-list"></div>
                </div>
                <div id="reviewErrorMessage" class="login-error-message hidden" role="alert" aria-live="polite"></div>
                <div class="form-actions">
                    <button type="button" id="cancelReview" class="btn btn-secondary">Отмена</button>
                    <button type="submit" id="submitReviewBtn" class="btn btn-primary">Отправить на модерацию</button>
                </div>
            </form>
        </div>
    </div>
</div>
